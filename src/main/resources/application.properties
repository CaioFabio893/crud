spring.application.name=crud
spring.config.import=optional:file:./application-local.properties

# PostgreSQL: use os mesmos dados de conexao cadastrados no pgAdmin.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crud}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Desenvolvimento local: cria e atualiza as tabelas das entidades.
spring.jpa.hibernate.ddl-auto=update

